name: Publish approved ACC product

on:
  repository_dispatch:
    types:
      - acc-publish-product

permissions:
  contents: write

# Serialize catalog writes so concurrent product publications cannot race on main.
concurrency:
  group: acc-product-catalog-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production catalog
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update products.json
        id: publish
        env:
          PRODUCT_JSON: ${{ toJson(github.event.client_payload.product) }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const product = JSON.parse(process.env.PRODUCT_JSON || 'null');
          if (!product || !/^[0-9]{1,20}$/.test(String(product.id))) throw new Error('Invalid product payload');
          execFileSync('git', ['config', 'user.name', 'github-actions[bot]']);
          execFileSync('git', ['config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com']);
          let commit = '';
          let published = false;
          // Rebuild from the newest main on every attempt to avoid losing concurrent catalog updates.
          for (let attempt = 1; attempt <= 5; attempt++) {
            execFileSync('git', ['fetch', 'origin', 'main']);
            execFileSync('git', ['reset', '--hard', 'origin/main']);
            const products = JSON.parse(fs.readFileSync('products.json', 'utf8'));
            if (!Array.isArray(products)) throw new Error('products.json must contain an array');
            const index = products.findIndex(item => String(item.id) === String(product.id));
            if (index >= 0) products[index] = { ...products[index], ...product };
            else products.push(product);
            fs.writeFileSync('products.json', JSON.stringify(products, null, 2) + '\n', 'utf8');
            execFileSync('git', ['add', 'products.json']);
            try {
              execFileSync('git', ['diff', '--cached', '--quiet']);
              commit = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
              published = true; // Product data already matches main.
              break;
            } catch {
              execFileSync('git', ['commit', '-m', 'Publish ACC product ' + product.id]);
            }
            try {
              execFileSync('git', ['push', 'origin', 'HEAD:main']);
              commit = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
              published = true;
              break;
            } catch (error) {
              console.log('Push attempt ' + attempt + ' lost a race; retrying from latest main.');
              if (attempt === 5) throw error;
            }
          }
          if (!published || !commit) throw new Error('Could not confirm product commit on main');
          NODE
      - name: Confirm publication in ACC admin database
        if: always()
        env:
          ACC_CONTENTS_TOKEN: ${{ secrets.ACC_CONTENTS_TOKEN }}
          ITEM_ID: ${{ github.event.client_payload.item_id }}
          SUCCESS: ${{ steps.publish.outcome == 'success' }}
          COMMIT_SHA: ${{ steps.publish.outputs.commit_sha }}
        run: |
          test -n "$ITEM_ID" || exit 0
          node <<'NODE'
          (async () => {
            const response = await fetch('https://allacontactical-bot.allacontactical.workers.dev/internal/publish-callback', {
              method: 'POST',
              headers: { 'Authorization': 'Bearer ' + process.env.ACC_CONTENTS_TOKEN, 'Content-Type': 'application/json' },
              body: JSON.stringify({
                id: Number(process.env.ITEM_ID),
                success: process.env.SUCCESS === 'true',
                commit_sha: process.env.COMMIT_SHA || ''
              })
            });
            if (!response.ok) throw new Error('Callback failed: ' + response.status + ' ' + await response.text());
            console.log(await response.text());
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
