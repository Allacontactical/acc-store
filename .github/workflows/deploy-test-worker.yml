name: Deploy isolated AllaconTactical test bot

concurrency:
  group: allacontactical-test-worker
  cancel-in-progress: false

on:
  push:
    branches:
      - test/telegram-bot
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: test/telegram-bot
      - name: Generate webhook secret
        id: webhook-secret
        shell: bash
        run: |
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          echo "secret=$secret" >> "$GITHUB_OUTPUT"
      - name: Deploy test Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_TEST_API_TOKEN }}
          accountId: c19b4ac9465afa5249a41141eabfab21
          command: deploy --config wrangler.jsonc
          secrets: |
            TELEGRAM_BOT_TOKEN
            TELEGRAM_WEBHOOK_SECRET
            ADMIN_TELEGRAM_ID
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ steps.webhook-secret.outputs.secret }}
          ADMIN_TELEGRAM_ID: ${{ secrets.ADMIN_TELEGRAM_ID }}
          TELEGRAM_BOT_USERNAME: AllaconTacticalTest_bot
      - name: Verify test account page
        run: |
          status=$(curl --location --max-redirs 5 --retry 5 --retry-delay 2 --retry-all-errors --silent --show-error \
            -D /tmp/acc-account-headers.txt \
            -w '%{http_code} %{url_effective}' \
            https://allacontactical-bot-test.allacontactical.workers.dev/account.html \
            -o /tmp/acc-account.html)
          echo "Account page final status and URL: $status"
          echo "Response headers:"
          cat /tmp/acc-account-headers.txt
          echo "Account page response preview:"
          head -c 600 /tmp/acc-account.html
          echo
          test "${status%% *}" = "200"
          grep -q 'loginButton' /tmp/acc-account.html
          grep -q 'cart-row-controls' /tmp/acc-account.html
          grep -q 'cart-quantity' /tmp/acc-account.html
          grep -q 'Видалити' /tmp/acc-account.html
          echo "Live account page includes visible cart quantity and removal controls"

      - name: Verify category pages and product catalog
        shell: bash
        run: |
          base="https://allacontactical-bot-test.allacontactical.workers.dev"
          for page in hunting-clothing.html hunting-footwear.html hunting-headwear.html hunting-accessories.html tactical-gear.html fishing-gear.html catalog.html; do
            code=$(curl --fail --silent --show-error -o "/tmp/$page" -w '%{http_code}' "$base/$page")
            echo "$page: HTTP $code"
            test "$code" = "200"
            test -s "/tmp/$page"
          done
          code=$(curl --fail --silent --show-error -o /tmp/acc-products.json -w '%{http_code}' "$base/products.json")
          echo "products.json: HTTP $code"
          test "$code" = "200"
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("/tmp/acc-products.json","utf8"));if(!Array.isArray(p)||p.length<1)process.exit(1);console.log("Catalog JSON valid; products:",p.length)'
          grep -q 'fetch("./products.json")' /tmp/hunting-clothing.html
          node scripts/test-catalog-coverage.mjs
      - name: Apply test D1 migration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TEST_API_TOKEN }}
        run: |
          npx --yes wrangler@4.157.0 d1 migrations apply acc-test-db --remote --config wrangler.jsonc
      - name: Verify authenticated cart persistence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TEST_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          base="https://allacontactical-bot-test.allacontactical.workers.dev"
          session_token="$(openssl rand -hex 32)"
          echo "::add-mask::$session_token"
          session_hash="$(printf '%s' "$session_token" | sha256sum | awk '{print $1}')"
          echo "::add-mask::$session_hash"
          cleanup() {
            npx --yes wrangler@4.157.0 d1 execute acc-test-db --remote --config wrangler.jsonc --command "DELETE FROM users WHERE telegram_user_id='ci-cart-test';" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          sql="DELETE FROM users WHERE telegram_user_id='ci-cart-test'; INSERT INTO users (telegram_user_id, telegram_username, first_name) VALUES ('ci-cart-test','ci_cart_test','CI Cart Test'); INSERT INTO sessions (user_id,token_hash,expires_at) SELECT id,'$session_hash',strftime('%Y-%m-%dT%H:%M:%fZ','now','+1 hour') FROM users WHERE telegram_user_id='ci-cart-test';"
          npx --yes wrangler@4.157.0 d1 execute acc-test-db --remote --config wrangler.jsonc --command "$sql"
          profile="$(curl --fail-with-body --silent --show-error "$base/account/me" -H "Authorization: Bearer $session_token")"
          echo "$profile" | jq -e '.user.first_name == "CI Cart Test"' >/dev/null
          initial="$(curl --fail-with-body --silent --show-error "$base/account/cart" -H "Authorization: Bearer $session_token")"
          echo "$initial" | jq -e '.cart == {}' >/dev/null
          saved="$(curl --fail-with-body --silent --show-error -X PUT "$base/account/cart" -H "Authorization: Bearer $session_token" -H "Content-Type: application/json" --data '{"cart":{"2534652617":2,"2457811325":1}}')"
          echo "$saved" | jq -e '.ok == true and .cart["2534652617"] == 2 and .cart["2457811325"] == 1' >/dev/null
          reloaded="$(curl --fail-with-body --silent --show-error "$base/account/cart" -H "Authorization: Bearer $session_token")"
          echo "$reloaded" | jq -e '.cart["2534652617"] == 2 and .cart["2457811325"] == 1' >/dev/null
          echo "Authenticated profile and cart save/read round-trip passed"
      - name: Set test Telegram webhook
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ steps.webhook-secret.outputs.secret }}
        run: |
          response=$(curl --fail-with-body --silent --show-error \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" \
            --data-urlencode "url=https://allacontactical-bot-test.allacontactical.workers.dev/webhook" \
            --data-urlencode "secret_token=${TELEGRAM_WEBHOOK_SECRET}")
          echo "$response" | jq -e '.ok == true' >/dev/null
