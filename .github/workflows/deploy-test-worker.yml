name: Deploy isolated AllaconTactical test bot

concurrency:
  group: allacontactical-test-worker
  cancel-in-progress: false

on:
  push:
    branches:
      - test/telegram-bot
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: test/telegram-bot
      - name: Generate webhook secret
        id: webhook-secret
        shell: bash
        run: |
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          echo "secret=$secret" >> "$GITHUB_OUTPUT"
      - name: Deploy test Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_TEST_API_TOKEN }}
          accountId: c19b4ac9465afa5249a41141eabfab21
          command: deploy --config wrangler.jsonc
          secrets: |
            TELEGRAM_BOT_TOKEN
            TELEGRAM_WEBHOOK_SECRET
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ steps.webhook-secret.outputs.secret }}
          TELEGRAM_BOT_USERNAME: AllaconTacticalTest_bot
      - name: Verify test account page
        run: |
          status=$(curl --location --max-redirs 5 --retry 5 --retry-delay 2 --retry-all-errors --silent --show-error \
            -D /tmp/acc-account-headers.txt \
            -w '%{http_code} %{url_effective}' \
            https://allacontactical-bot-test.allacontactical.workers.dev/account.html \
            -o /tmp/acc-account.html)
          echo "Account page final status and URL: $status"
          echo "Response headers:"
          cat /tmp/acc-account-headers.txt
          echo "Account page response preview:"
          head -c 600 /tmp/acc-account.html
          echo
          test "${status%% *}" = "200"
          grep -q 'loginButton' /tmp/acc-account.html

      - name: Verify category pages and product catalog
        shell: bash
        run: |
          base="https://allacontactical-bot-test.allacontactical.workers.dev"
          for page in hunting-clothing.html hunting-footwear.html hunting-headwear.html hunting-accessories.html tactical-gear.html fishing-gear.html catalog.html; do
            code=$(curl --fail --silent --show-error -o "/tmp/$page" -w '%{http_code}' "$base/$page")
            echo "$page: HTTP $code"
            test "$code" = "200"
            test -s "/tmp/$page"
          done
          code=$(curl --fail --silent --show-error -o /tmp/acc-products.json -w '%{http_code}' "$base/products.json")
          echo "products.json: HTTP $code"
          test "$code" = "200"
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("/tmp/acc-products.json","utf8"));if(!Array.isArray(p)||p.length<1)process.exit(1);console.log("Catalog JSON valid; products:",p.length)'
          grep -q 'fetch("./products.json")' /tmp/hunting-clothing.html
      - name: Apply test D1 migration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TEST_API_TOKEN }}
        run: |
          npx --yes wrangler@4.157.0 d1 migrations apply acc-test-db --remote --config wrangler.jsonc
      - name: Set test Telegram webhook
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ steps.webhook-secret.outputs.secret }}
        run: |
          response=$(curl --fail-with-body --silent --show-error \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" \
            --data-urlencode "url=https://allacontactical-bot-test.allacontactical.workers.dev/webhook" \
            --data-urlencode "secret_token=${TELEGRAM_WEBHOOK_SECRET}")
          echo "$response" | jq -e '.ok == true' >/dev/null
