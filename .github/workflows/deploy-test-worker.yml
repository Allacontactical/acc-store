name: Deploy isolated AllaconTactical test bot

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: test/telegram-bot
      - name: Deploy test Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_TEST_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc
          secrets: |
            TELEGRAM_BOT_TOKEN
            TELEGRAM_WEBHOOK_SECRET
            TELEGRAM_BOT_USERNAME
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_TEST_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_TEST_WEBHOOK_SECRET }}
          TELEGRAM_BOT_USERNAME: ${{ secrets.TELEGRAM_TEST_BOT_USERNAME }}
      - name: Apply test D1 migration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TEST_API_TOKEN }}
        run: |
          npx wrangler d1 migrations apply acc-test-db --remote --config wrangler.jsonc
      - name: Set test Telegram webhook
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_TEST_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_TEST_WEBHOOK_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" \
            --data-urlencode "url=https://allacontactical-bot-test.allacontactical.workers.dev/webhook" \
            --data-urlencode "secret_token=${TELEGRAM_WEBHOOK_SECRET}"
