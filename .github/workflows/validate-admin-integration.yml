name: Validate ACC production admin integration

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "admin-site/**"
      - "migrations/**"
      - "wrangler.jsonc"
      - ".github/workflows/validate-admin-integration.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker JavaScript syntax
        run: node --input-type=module --check < src/index.js
      - name: Check admin page JavaScript
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('admin-site/admin.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:\\s[^>]*)?>([\\s\\S]*?)<\\/script>/gi)]
            .map(match => match[1]).filter(script => script.trim());
          if (scripts.length !== 1) throw new Error('Expected exactly one inline admin script');
          new Function(scripts[0]);
          console.log('Admin JavaScript syntax OK');
          NODE
      - name: Validate Wrangler configuration
        run: node -e "JSON.parse(require('node:fs').readFileSync('wrangler.jsonc', 'utf8')); console.log('Wrangler JSON OK')"
      - name: Cloudflare Worker dry run
        run: npx --yes wrangler@4.157.0 deploy --dry-run --config wrangler.jsonc
