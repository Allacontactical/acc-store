name: Validate ACC production admin integration

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "admin-site/**"
      - "migrations/**"
      - "wrangler.jsonc"
      - ".github/workflows/validate-admin-integration.yml"
      - ".github/workflows/publish-acc-product.yml"
      - ".github/workflows/deploy-worker.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate GitHub Actions workflow YAML
        run: |
          ruby -e 'require "yaml"; Dir[".github/workflows/*.yml"].each { |f| YAML.load_file(f); puts "#{f}: YAML OK" }'
      - name: Smoke-test D1 migrations
        run: |
          python3 - <<'PY'
          import pathlib, sqlite3
          db = sqlite3.connect(":memory:")
          db.executescript(pathlib.Path("migrations/0001_telegram_auth.sql").read_text())
          db.executescript(pathlib.Path("migrations/0002_user_carts.sql").read_text())
          db.execute("INSERT INTO users (telegram_user_id) VALUES (?)", ("smoke-test",))
          db.commit()
          for name in ["0003_admin_import_queue.sql", "0004_import_quantity.sql", "0005_publication_state.sql"]:
              db.executescript(pathlib.Path("migrations/" + name).read_text())
          columns = {row[1] for row in db.execute("PRAGMA table_info(import_items)")}
          required = {"quantity", "is_published", "public_product_id", "publish_status", "publish_commit_sha"}
          missing = required - columns
          if missing:
              raise SystemExit("Missing migration columns: " + ", ".join(sorted(missing)))
          print("D1 migration smoke test OK")
          PY
      - name: Check Worker JavaScript syntax
        run: node --input-type=module --check < src/index.js
      - name: Check admin page JavaScript
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('admin-site/admin.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)]
            .map(match => match[1]).filter(script => script.trim());
          if (scripts.length !== 1) throw new Error('Expected exactly one inline admin script');
          new Function(scripts[0]);
          console.log('Admin JavaScript syntax OK');
          NODE
      - name: Validate Wrangler configuration
        run: node -e "JSON.parse(require('node:fs').readFileSync('wrangler.jsonc', 'utf8')); console.log('Wrangler JSON OK')"
      - name: Cloudflare Worker dry run
        run: npx --yes wrangler@4.157.0 deploy --dry-run --config wrangler.jsonc
