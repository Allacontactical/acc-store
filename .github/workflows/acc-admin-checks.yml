name: ACC admin panel checks

on:
  push:
    branches:
      - feature/acc-admin-v2
      - fix/acc-admin-import-csv-xlsx
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check admin-api/src/index.js
          node --check admin/admin.js
          node --check scripts/build-admin-import.mjs
          node --check catalog-api-config.js
          node --check scripts/test-prom-csv-parser.mjs
          node --check scripts/test-admin-browser.mjs
      - name: Test Prom CSV parser
        run: node scripts/test-prom-csv-parser.mjs
      - name: Install isolated browser-test dependencies
        run: npm install --no-save playwright xlsx
      - name: Install Chromium for browser test
        run: npx playwright install --with-deps chromium
      - name: Test admin XLSX import in isolated browser
        run: node scripts/test-admin-browser.mjs
      - name: Validate Worker configuration
        run: node -e "JSON.parse(require('fs').readFileSync('admin-api/wrangler.jsonc','utf8'))"
      - name: Test D1 migrations and current catalog import
        run: |
          sqlite3 /tmp/acc-admin-test.db < admin-api/migrations/0001_admin_schema.sql
          sqlite3 /tmp/acc-admin-test.db < admin-api/migrations/0002_legacy_product_payload.sql
          sqlite3 /tmp/acc-admin-test.db < admin-api/migrations/0003_unique_source_product_id.sql
          sqlite3 /tmp/acc-admin-test.db < admin-api/migrations/0004_prom_import_moderation.sql
          node scripts/build-admin-import.mjs products.json /tmp/acc-admin-import.sql
          sqlite3 /tmp/acc-admin-test.db < /tmp/acc-admin-import.sql
          test "$(sqlite3 /tmp/acc-admin-test.db 'SELECT COUNT(*) FROM acc_admin_products;')" -gt 0
          test "$(sqlite3 /tmp/acc-admin-test.db 'SELECT COUNT(*) FROM acc_admin_products WHERE status != "active";')" -eq 0
          echo "D1 schema and catalog import smoke test passed."
