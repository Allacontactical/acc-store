name: ACC photo pipeline

on:
  workflow_dispatch:
    inputs:
      max_products:
        description: "Maximum number of catalog products to process; 0 means all"
        required: true
        default: "1"
        type: string
      write_catalog:
        description: "Commit converted photo URLs to products.json after all selected products succeed"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: acc-photo-pipeline
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout catalog
        uses: actions/checkout@v4

      - name: Convert Prom photos and upload to R2
        env:
          ACC_CONTENTS_TOKEN: ${{ secrets.ACC_CONTENTS_TOKEN }}
          MAX_PRODUCTS: ${{ inputs.max_products }}
          WRITE_CATALOG: ${{ inputs.write_catalog }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const file = "products.json";
          const products = JSON.parse(fs.readFileSync(file, "utf8"));
          if (!Array.isArray(products)) throw new Error("products.json must contain an array");
          if (!process.env.ACC_CONTENTS_TOKEN) throw new Error("Missing ACC_CONTENTS_TOKEN");
          const limit = Number(process.env.MAX_PRODUCTS);
          if (!Number.isInteger(limit) || limit < 0) throw new Error("max_products must be 0 or a positive integer");
          const selected = products.filter(p => Array.isArray(p.images) && p.images.some(u => /^https:\/\/images\.prom\.ua\//i.test(u)));
          const work = limit === 0 ? selected : selected.slice(0, limit);
          let converted = 0, skipped = 0, photoCount = 0;
          async function convert(urls) {
            const response = await fetch("https://allacontactical-bot.allacontactical.workers.dev/internal/photo-pipeline", {
              method: "POST",
              headers: { "Authorization": "Bearer " + process.env.ACC_CONTENTS_TOKEN, "Content-Type": "application/json" },
              body: JSON.stringify({ sources: urls })
            });
            const data = await response.json();
            if (!response.ok || !data.ok) throw new Error("Photo pipeline failed: " + JSON.stringify(data));
            return data.images;
          }
          for (const product of work) {
            const original = product.images || (product.image ? [product.image] : []);
            const next = [];
            for (let i = 0; i < original.length; i += 10) {
              const batch = original.slice(i, i + 10);
              const pending = batch.filter(u => /^https:\/\/images\.prom\.ua\//i.test(u));
              const done = pending.length ? await convert(pending) : [];
              const bySource = new Map(done.map(x => [x.source, x.url]));
              for (const source of batch) {
                if (bySource.has(source)) { next.push(bySource.get(source)); converted++; photoCount++; }
                else { next.push(source); skipped++; }
              }
            }
            product.images = next;
            if (next.length) product.image = next[0];
            console.log(JSON.stringify({ product_id: product.id, title: product.title, images: next.length, converted: next.filter(x => x.includes("/product-images/")).length }));
          }
          if (process.env.WRITE_CATALOG === "true") {
            if (!work.length) throw new Error("No eligible Prom images found");
            fs.writeFileSync(file, JSON.stringify(products, null, 2) + "\n");
            const { execFileSync } = require("node:child_process");
            execFileSync("git", ["config", "user.name", "github-actions[bot]"]);
            execFileSync("git", ["config", "user.email", "41898282+users.noreply.github.com"]);
            execFileSync("git", ["add", file]);
            execFileSync("git", ["commit", "-m", "Store optimized ACC product photos in R2"]);
            execFileSync("git", ["push", "origin", "HEAD:main"]);
          }
          console.log(JSON.stringify({ selected_products: work.length, converted_images: converted, unchanged_images: skipped, catalog_written: process.env.WRITE_CATALOG === "true" }));
          NODE
