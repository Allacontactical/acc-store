# Re-run after fixing the Worker R2 image-key route validation.
name: ACC photo pipeline

on:
  workflow_dispatch:
    inputs:
      max_products:
        description: "Maximum number of items in the 281-item import batch; 0 means all"
        required: true
        default: "0"
        type: string
      write_catalog:
        description: "Update published product cards after successful R2 upload"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: acc-photo-pipeline
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout production catalog
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Read and verify the exact 281-item import batch
        id: inventory
        env:
          ACC_CONTENTS_TOKEN: ${{ secrets.ACC_CONTENTS_TOKEN }}
        run: |
          node <<'NODE'
          (async () => {
            const base = "https://allacontactical-bot.allacontactical.workers.dev/internal/photo-pipeline";
            const headers = { "Authorization": "Bearer " + process.env.ACC_CONTENTS_TOKEN };
            const batchesResponse = await fetch(base + "/batches", { headers });
            const batchesData = await batchesResponse.json();
            if (!batchesResponse.ok) throw new Error("Batch inventory failed: " + JSON.stringify(batchesData));
            const batch = (batchesData.batches || []).find(x => x.source_name === "ACC_281_products_no_optics_admin_import.xlsx" && x.total_items === 281 && x.imported_items === 281 && x.status === "ready");
            if (!batch) throw new Error("The exact ready 281-item ACC import batch was not found; no photos were changed.");
            const itemsResponse = await fetch(base + "/items?batch_id=" + encodeURIComponent(batch.id), { headers });
            const itemsData = await itemsResponse.json();
            if (!itemsResponse.ok) throw new Error("Batch items request failed: " + JSON.stringify(itemsData));
            if (!Array.isArray(itemsData.items) || itemsData.items.length !== 281) throw new Error("Expected exactly 281 import rows, received " + (itemsData.items || []).length);
            let refs = 0, blank = 0, quantityBlank = 0;
            for (const item of itemsData.items) {
              let images = [];
              try { images = JSON.parse(item.image_urls_json || "[]"); } catch { throw new Error("Invalid image_urls_json for item " + item.id); }
              if (!Array.isArray(images)) throw new Error("Image list is not an array for item " + item.id);
              refs += images.length;
              if (!images.length) blank++;
              if (item.quantity == null || String(item.quantity).trim() === "") quantityBlank++;
            }
            console.log(JSON.stringify({ batch_id: batch.id, items: itemsData.items.length, image_references: refs, items_without_images: blank, quantity_blank: quantityBlank }));
            require("node:fs").appendFileSync(process.env.GITHUB_OUTPUT, "batch_id=" + batch.id + "\nitems=281\nimage_refs=" + refs + "\n");
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Convert all selected photos to WebP and verify R2
        env:
          ACC_CONTENTS_TOKEN: ${{ secrets.ACC_CONTENTS_TOKEN }}
          BATCH_ID: ${{ steps.inventory.outputs.batch_id }}
          MAX_PRODUCTS: ${{ inputs.max_products || '0' }}
          WRITE_CATALOG: ${{ inputs.write_catalog }}
        run: |
          node <<'NODE'
          (async () => {
            const fs = require("node:fs");
            const crypto = require("node:crypto");
            const { execFileSync } = require("node:child_process");
            const base = "https://allacontactical-bot.allacontactical.workers.dev/internal/photo-pipeline";
            const headers = { "Authorization": "Bearer " + process.env.ACC_CONTENTS_TOKEN, "Content-Type": "application/json" };
            const limit = Number(process.env.MAX_PRODUCTS);
            if (!Number.isInteger(limit) || limit < 0) throw new Error("Invalid max_products");
            const response = await fetch(base + "/items?batch_id=" + encodeURIComponent(process.env.BATCH_ID), { headers });
            const data = await response.json();
            if (!response.ok || !Array.isArray(data.items) || data.items.length !== 281) throw new Error("Could not load the exact 281-item batch: " + JSON.stringify(data));
            const allItems = data.items;
            const work = limit === 0 ? allItems : allItems.slice(0, limit);
            const cache = new Map();
            const updates = [];
            const products = JSON.parse(fs.readFileSync("products.json", "utf8"));
            const catalog = new Map(products.map(p => [String(p.id), p]));
            let sourceRefs = 0, converted = 0, alreadyLocal = 0, blankItems = 0, catalogUpdated = 0;
            const failures = [];
            const parsedItems = work.map(item => {
              let images;
              try { images = JSON.parse(item.image_urls_json || "[]"); } catch { throw new Error("Invalid image list for import item " + item.id); }
              if (!Array.isArray(images)) throw new Error("Invalid image list for import item " + item.id);
              sourceRefs += images.length;
              if (!images.length) blankItems++;
              for (const source of images) {
                if (typeof source !== "string") throw new Error("Non-string image URL in item " + item.id);
                if (source.includes("/product-images/")) {
                  cache.set(source, source);
                  alreadyLocal++;
                } else {
                  const parsed = new URL(source);
                  if (parsed.protocol !== "https:" || parsed.hostname !== "images.prom.ua") throw new Error("Unexpected image host for item " + item.id + ": " + parsed.hostname);
                }
              }
              return { item, images };
            });

            async function verifyR2(url) {
              const r = await fetch(url, { method: "HEAD", signal: AbortSignal.timeout(20000) });
              const type = (r.headers.get("Content-Type") || "").split(";")[0].trim().toLowerCase();
              if (!r.ok || type !== "image/webp") throw new Error("R2 verification failed: HTTP " + r.status + ", " + type);
            }

            const existingUrls = [...new Set(parsedItems.flatMap(entry => entry.images.filter(source => source.includes("/product-images/"))) )];
            for (let i = 0; i < existingUrls.length; i += 40) {
              await Promise.all(existingUrls.slice(i, i + 40).map(verifyR2));
            }

            function imageSlug(value) {
              const tr = {а:"a",б:"b",в:"v",г:"h",ґ:"g",д:"d",е:"e",є:"ye",ж:"zh",з:"z",и:"y",і:"i",ї:"yi",й:"y",к:"k",л:"l",м:"m",н:"n",о:"o",п:"p",р:"r",с:"s",т:"t",у:"u",ф:"f",х:"kh",ц:"ts",ч:"ch",ш:"sh",щ:"shch",ь:"",ю:"yu",я:"ya",ы:"y",э:"e",ъ:"",ё:"yo"};
              return String(value || "allacon-product").toLowerCase().replace(/[а-яёіїєґ]/g, ch => tr[ch] ?? ch)
                .normalize("NFKD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-")
                .replace(/^-+|-+$/g, "").slice(0, 72).replace(/-+$/g, "") || "allacon-product";
            }
            // Keep every image tied to its own product and position. The same Prom URL
            // can be reused by different products; source-only caching would assign
            // the first product's filename to every later product using that URL.
            const photoTasks = [];
            for (const entry of parsedItems) {
              entry.cacheKeys = entry.images.map((source, imageIndex) => {
                if (source.includes("/product-images/")) return source;
                const cacheKey = entry.item.id + ":" + imageIndex + ":" + source;
                const idPart = String(entry.item.product_id || entry.item.id).replace(/[^a-z0-9]/gi, "").slice(-8) || String(entry.item.id);
                const suffix = crypto.createHash("sha1").update(cacheKey).digest("hex").slice(0, 8);
                photoTasks.push({
                  source,
                  cacheKey,
                  fileName: imageSlug(entry.item.title) + "-" + idPart + "-" + (imageIndex + 1) + "-" + suffix + ".webp"
                });
                return cacheKey;
              });
            }
            const chunks = [];
            for (let i = 0; i < photoTasks.length; i += 10) chunks.push(photoTasks.slice(i, i + 10));

            async function processChunk(chunk, index) {
              let lastError = null;
              for (let attempt = 1; attempt <= 3; attempt++) {
                try {
                  const r = await fetch(base, {
                    method: "POST", headers, body: JSON.stringify({ sources: chunk.map(task => task.source), file_names: chunk.map(task => task.fileName) }),
                    signal: AbortSignal.timeout(60000)
                  });
                  const result = await r.json();
                  if (!r.ok || !result.ok) throw new Error("Image conversion request failed: " + JSON.stringify(result));
                  const successes = result.images || [];
                  const failed = result.failures || [];
                  const outcomes = [...successes, ...failed];
                  const returned = new Set(outcomes.map(x => x.index));
                  if (outcomes.length !== chunk.length || returned.size !== chunk.length || chunk.some((task, taskIndex) => !returned.has(taskIndex))) {
                    throw new Error("Worker omitted or duplicated one or more image task results");
                  }
                  await Promise.all(successes.map(async image => {
                    const task = chunk[image.index];
                    if (!task || image.source !== task.source) throw new Error("Worker returned an image for the wrong task");
                    await verifyR2(image.url);
                    cache.set(task.cacheKey, image.url);
                    converted++;
                  }));
                  for (const image of failed) {
                    const task = chunk[image.index];
                    if (!task || image.source !== task.source) throw new Error("Worker returned a failure for the wrong task");
                    cache.set(task.cacheKey, task.source);
                    failures.push({ source: task.source, product_id: task.cacheKey.split(":")[0], error: image.error });
                  }
                  console.log(JSON.stringify({ photo_chunk: index + 1, total_chunks: chunks.length, sources: chunk.length, converted: successes.length, failed: failed.length, attempt }));
                  return;
                } catch (error) {
                  lastError = error;
                  console.error(JSON.stringify({ photo_chunk: index + 1, attempt, error: String(error.message || error) }));
                  if (attempt < 3) await new Promise(resolve => setTimeout(resolve, attempt * 3000));
                }
              }
              for (const task of chunk) {
                cache.set(task.cacheKey, task.source);
                failures.push({ source: task.source, product_id: task.cacheKey.split(":")[0], error: String(lastError?.message || lastError || "conversion failed").slice(0, 220) });
              }
            }

            const concurrency = 6;
            for (let i = 0; i < chunks.length; i += concurrency) {
              await Promise.all(chunks.slice(i, i + concurrency).map((chunk, offset) => processChunk(chunk, i + offset)));
            }

            for (const { item, images } of parsedItems) {
              if (!images.length) continue;
              const next = images.map((source, imageIndex) => source.includes("/product-images/") ? source : cache.get(item.id + ":" + imageIndex + ":" + source));
              if (next.some(value => typeof value !== "string")) throw new Error("Missing converted image mapping for import item " + item.id);
              updates.push({ id: item.id, images: next });
              const publicId = item.public_product_id || item.product_id;
              if (item.is_published && publicId && catalog.has(String(publicId))) {
                const product = catalog.get(String(publicId));
                product.images = next;
                product.image = next[0];
                catalogUpdated++;
              }
            }
            if (updates.length) {
              const saved = await fetch(base + "/save", { method: "POST", headers, body: JSON.stringify({ batch_id: process.env.BATCH_ID, updates }) });
              const result = await saved.json();
              if (!saved.ok || !result.ok || result.updated !== updates.length) throw new Error("Could not save all image links to D1: " + JSON.stringify(result));
            }

            if (process.env.WRITE_CATALOG === "true" && catalogUpdated) {
              fs.writeFileSync("products.json", JSON.stringify(products, null, 2) + "\n");
              execFileSync("git", ["config", "user.name", "github-actions[bot]"]);
              execFileSync("git", ["config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"]);
              execFileSync("git", ["add", "products.json"]);
              try {
                execFileSync("git", ["diff", "--cached", "--quiet"]);
                console.log("Published product photos already match the R2 catalog; no catalog commit is needed.");
              } catch {
                execFileSync("git", ["commit", "-m", "Update published ACC products with optimized R2 photos"]);
                execFileSync("git", ["push", "origin", "HEAD:main"]);
              }
            }
            console.log(JSON.stringify({ batch_items: work.length, processed_items: updates.length, image_references: sourceRefs, converted_images: converted, already_in_r2: alreadyLocal, failed_images: failures.length, failure_examples: failures.slice(0, 20), items_without_images: blankItems, published_cards_updated: catalogUpdated, d1_saved: updates.length, catalog_written: process.env.WRITE_CATALOG === "true" }));
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
