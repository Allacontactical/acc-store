name: Deploy AllaconTactical Telegram Bot

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "worker-assets/**"
      - "migrations/**"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-worker.yml"

concurrency:
  group: allacontactical-production-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Generate webhook secret
        id: webhook-secret
        shell: bash
        run: |
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          echo "secret=$secret" >> "$GITHUB_OUTPUT"
      - name: Apply production D1 migrations
        run: |
          npx --yes wrangler@4.157.0 d1 migrations apply acc-catalog-db --remote --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy production Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc
          secrets: |
            TELEGRAM_BOT_TOKEN
            TELEGRAM_WEBHOOK_SECRET
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ steps.webhook-secret.outputs.secret }}
          TELEGRAM_BOT_USERNAME: Allacontactical_bot
      - name: Verify production account and API routes
        shell: bash
        run: |
          base="https://allacontactical-bot.allacontactical.workers.dev"
          for path in account.html; do
            code=$(curl --fail --silent --show-error -o "/tmp/$path" -w '%{http_code}' "$base/$path")
            test "$code" = "200"
            grep -q 'loginButton' "/tmp/$path"
            grep -q 'cart-row-controls' "/tmp/$path"
            grep -q 'Видалити' "/tmp/$path"
          done
          echo "Production account page is available and includes cart controls."
      - name: Set production Telegram webhook
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ steps.webhook-secret.outputs.secret }}
        run: |
          response=$(curl --fail-with-body --silent --show-error \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" \
            --data-urlencode "url=https://allacontactical-bot.allacontactical.workers.dev/webhook" \
            --data-urlencode "secret_token=${TELEGRAM_WEBHOOK_SECRET}")
          echo "$response" | jq -e '.ok == true' >/dev/null
