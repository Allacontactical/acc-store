name: Deploy AllaconTactical Telegram Bot

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "worker-assets/**"
      - "admin-site/**"
      - "migrations/**"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-worker.yml"

concurrency:
  group: allacontactical-production-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify admin access secret is configured
        shell: bash
        env:
          ADMIN_TELEGRAM_ID: ${{ secrets.ADMIN_TELEGRAM_ID }}
        run: |
          test -n "$ADMIN_TELEGRAM_ID" || { echo "Missing GitHub Actions secret ADMIN_TELEGRAM_ID"; exit 1; }
          echo "Admin Telegram ID secret is configured."
      - name: Verify GitHub catalog publishing token is configured
        shell: bash
        env:
          ACC_CONTENTS_TOKEN: ${{ secrets.ACC_CONTENTS_TOKEN }}
        run: |
          test -n "$ACC_CONTENTS_TOKEN" || { echo "Missing GitHub Actions secret ACC_CONTENTS_TOKEN (fine-grained token with Contents read/write access to Allacontactical/acc-store)"; exit 1; }
          echo "GitHub catalog publishing token is configured."
      - name: Verify stable Telegram webhook secret is configured
        shell: bash
        env:
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: |
          if [[ ! "$TELEGRAM_WEBHOOK_SECRET" =~ ^[a-f0-9]{64}$ ]]; then
            echo "Missing or invalid GitHub Actions secret TELEGRAM_WEBHOOK_SECRET."
            echo "Create a persistent 64-character lowercase hex secret (for example: openssl rand -hex 32) and save it in repository Actions secrets."
            exit 1
          fi
          echo "Stable Telegram webhook secret is configured."
      - name: List D1 databases accessible to deployment token
        run: npx --yes wrangler@4.157.0 d1 list --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Apply production D1 migrations
        run: |
          npx --yes wrangler@4.157.0 d1 migrations apply acc-catalog-db --remote --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy production Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc
          secrets: |
            TELEGRAM_BOT_TOKEN
            TELEGRAM_WEBHOOK_SECRET
            ADMIN_TELEGRAM_ID
            ACC_CONTENTS_TOKEN
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          ADMIN_TELEGRAM_ID: ${{ secrets.ADMIN_TELEGRAM_ID }}
          ACC_CONTENTS_TOKEN: ${{ secrets.ACC_CONTENTS_TOKEN }}
          TELEGRAM_BOT_USERNAME: Allacontactical_bot
      - name: Verify production account redirect
        shell: bash
        run: |
          base="https://allacontactical-bot.allacontactical.workers.dev"
          code=$(curl --silent --show-error -D /tmp/acc-account-headers.txt -o /dev/null -w '%{http_code}' "$base/account.html")
          echo "Account redirect HTTP status: $code"
          cat /tmp/acc-account-headers.txt
          test "$code" = "302"
          grep -qi '^location: https://allacontactical.com.ua/account.html' /tmp/acc-account-headers.txt
          echo "Worker redirects customers to the same-origin account page."
      - name: Set production Telegram webhook
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: |
          response=$(curl --fail-with-body --silent --show-error \\
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" \\
            --data-urlencode "url=https://allacontactical-bot.allacontactical.workers.dev/webhook" \\
            --data-urlencode "secret_token=${TELEGRAM_WEBHOOK_SECRET}")
          echo "$response" | jq -e '.ok == true' >/dev/null
      - name: Verify Telegram bot identity and webhook delivery
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        shell: bash
        run: |
          echo "Telegram bot identity:"
          curl --fail-with-body --silent --show-error "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getMe" | jq '{ok, result: {id: .result.id, is_bot: .result.is_bot, first_name: .result.first_name, username: .result.username}}'
          echo "Telegram webhook status:"
          curl --fail-with-body --silent --show-error "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getWebhookInfo" | jq '{ok, result: {url: .result.url, pending_update_count: .result.pending_update_count, last_error_date: .result.last_error_date, last_error_message: .result.last_error_message, allowed_updates: .result.allowed_updates}}'

# Redeploy after production secrets are updated in GitHub Actions.
