name: ACC photo regression tests

on:
  pull_request:
    branches: [main]
    paths:
      - "src/index.js"
      - "product-gallery.js"
      - "product-gallery.css"
      - "scripts/photo-*.mjs"
      - "tests/photo-*.test.mjs"
      - "tests/product-gallery.test.mjs"
      - "products.json"
      - ".github/workflows/acc-photo-tests.yml"

jobs:
  photo-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check src/index.js
          node --check product-gallery.js
          node --check scripts/photo-names.mjs
          node --check scripts/build-photo-registry.mjs
          node --check scripts/photo-test-run.mjs
      - name: Run photo regression tests
        run: node --test tests/photo-names.test.mjs tests/photo-pipeline.test.mjs tests/product-gallery.test.mjs
      - name: Run five-product dry run
        run: node scripts/photo-test-run.mjs
